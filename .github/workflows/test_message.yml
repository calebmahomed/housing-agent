name: test-message

# Manual smoke test of the enrichment + delivery path against a fake listing:
# real Routes API commute, real Claude scoring, real Telegram send. Touches no
# state and fetches no real listings, so it can't consume anything the poll
# should alert on.

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m housing_agent.test_message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
          ANNUAL_INCOME: ${{ secrets.ANNUAL_INCOME }}
          WORK_ADDRESS: ${{ secrets.WORK_ADDRESS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
