name: test-scrape

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How far back to look for newly-added listings"
        default: "720"
      limit:
        description: "Max notifications to send"
        default: "3"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # no chromium install: scraped makelaar sites serve plain HTML, so
      # fetch_page_text never needs the Playwright fallback here (and it fails
      # open if it ever did). Saves ~2 min and a flaky apt step per test run.

      # no `permissions: contents: write` and no commit step — this workflow
      # is read-only by design, so a test send can't consume a real listing
      - run: python -m housing_agent.test_scrape "${{ inputs.hours }}" "${{ inputs.limit }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
          ANNUAL_INCOME: ${{ secrets.ANNUAL_INCOME }}
          WORK_ADDRESS: ${{ secrets.WORK_ADDRESS }}
          # without this the test run silently scores nothing, so the workflow
          # we verify with wouldn't exercise the path we're verifying
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
