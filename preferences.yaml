# No city whitelist. A fixed list silently dropped exactly the small commuter
# towns that suit us — VERRA listings in Rijswijk, Oegstgeest and Maassluis were
# being filtered out, and Vesteda writes Den Haag as "'s-Gravenhage", which no
# hand-maintained list would have matched. Filter on the thing we actually care
# about instead: transit time to work (Singel 542, Amsterdam). This keeps Den
# Haag, Rijswijk, Delft and Leiden in, and drops Maastricht/Groningen/Assen
# without anyone having to remember to add them.
# Lookups fail open, so a Routes API outage never silently hides a listing.
max_commute_minutes: 90
# annual_income is NOT here on purpose — this repo is public. It comes from the
# ANNUAL_INCOME GitHub Actions secret via config.load_prefs().
income_to_rent_ratio: 3  # landlords typically require gross monthly income >= 3x rent
# What to assume when a listing page doesn't state its income requirement. We
# only get to use the friendly 3x when the page explicitly says 3x; silence
# means it could well be stricter, and applying for something we were never
# eligible for is the same wasted effort max_rent exists to avoid.
# At €55k gross this makes €1309 the real ceiling rather than max_rent's €1400.
# Set to 3.5 on 2026-08-20; revisit at ~10 tapped decisions — if rejections
# cluster in €1300-1400 with no stated ratio, move to 4.
assumed_income_to_rent_ratio: 3.5
# hard ceiling on total_monthly, binds before the €1528 income cap. Set to 1400
# on 2026-08-19 after a rejection at €1450 — at that level we're competing with
# applicants the landlord scores higher, so it's wasted effort rather than a
# near miss.
max_rent: 1400
min_bedrooms: 1
exclude_phrases:
  - "55+"
  - "55-plus"
  - "alleen studenten"
  - "student only"
  - "students only"
  - "geschikt voor één persoon"
  - "geschikt voor 1 persoon"
  - "suitable for one person"
# Regexes, checked against the listing page text as well as the description.
# Age-restricted complexes are the reason these exist: Vesteda phrases it as
# "min.leeftijd 50 jaar" / "min. leeftijd 50 jr", which no literal phrase above
# catches, and the age bound varies by complex (50, 55, 65).
exclude_patterns:
  - "min\\.?\\s*leeftijd\\s*\\d{2}"        # min.leeftijd 50 jaar / min. leeftijd 50 jr
  - "leeftijd\\s*(?:van|vanaf)?\\s*\\d{2}\\s*(?:jaar|jr)\\b"
  - "vanaf\\s*\\d{2}\\s*(?:jaar|jr)\\b"     # "vanaf 55 jaar"
  - "\\b(?:50|55|60|65)\\s*[-]?plus(?:sers|ers)?\\b"
  - "senioren(?:woning|complex|appartement)"
  - "\\bseniorenwoningen\\b"
